# ─────────────────────────────────────────────────────────────
# EMBER · WebAssembly edge runtime for the component model
# SPDX-License-Identifier: MIT
# ─────────────────────────────────────────────────────────────
[package]
name = "ember-edge"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
readme = "README.md"
description = "A lightweight WebAssembly edge runtime for the component model: WASI preview 2, per-tenant sandboxing, OCI hot reload, pluggable HTTP ingress."
repository = "https://github.com/opanai404/ember-edge"
keywords = ["wasm", "wasmtime", "wasi", "component-model", "edge", "serverless"]
categories = ["web-programming::http-server", "web-programming::wasm"]
authors = ["hrniu"]

[workspace]
resolver = "3"
members = ["."]

[lib]
name = "ember"
path = "src/lib.rs"

[[bin]]
name = "ember"
path = "src/main.rs"

[[bench]]
name = "invoke"
path = "benches/invoke.rs"
harness = false

[dependencies]
# ── WebAssembly runtime ──────────────────────────────────────
wasmtime = { version = "34", default-features = false, features = [
    "cranelift",
    "component-model",
    "pooling-allocator",
    "parallel-compilation",
    "async",
] }
wasmtime-wasi = "34"
wasmtime-wasi-http = "34"
wasm-tools = "0.230"

# ── HTTP ingress ─────────────────────────────────────────────
axum = { version = "0.8", features = ["http1", "tokio", "json"] }
tower = { version = "0.5", features = ["util", "timeout", "limit", "catch-panic"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "catch-panic"] }
http = "1.2"
http-body-util = "0.1"
bytes = "1"

# ── OCI distribution & module store ──────────────────────────
oci-distribution = "0.10"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
sha2 = "0.10"
hex = "0.4"

# ── Async & concurrency ──────────────────────────────────────
tokio = { version = "1.44", features = ["full"] }
parking_lot = "0.12"
arc-swap = "1"

# ── Observability ────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "ansi"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# ── Configuration & error handling ───────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
lto = "fat"
codegen-units = 1
debug = true

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
needless_borrow = "warn"
