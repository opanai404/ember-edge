# cargo-deny configuration used by the CI `deny` job. Advisories, bans, and
# sources use their default settings; only the license allowlist is customized.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "OpenSSL",
    "BSL-1.0",
]
